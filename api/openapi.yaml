openapi: 3.0.3
info:
  title: Authnode API
  version: 1.0.0
  description: Passwordless authentication service with OTP verification, JWT access tokens, refresh rotation and RBAC.
servers:
  - url: http://localhost:8000
paths:
  /live:
    get:
      tags: [health]
      responses:
        "200": {description: Process is alive}
  /ready:
    get:
      tags: [health]
      responses:
        "200": {description: Service and database are ready}
        "503": {description: A dependency is unavailable}
  /api/v1/auth/registrations:
    post:
      tags: [authentication]
      summary: Start registration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationRequest"}
      responses:
        "201":
          description: OTP was sent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationSession"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/auth/registrations/confirm:
    post:
      tags: [authentication]
      summary: Confirm registration OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmRegistration"}
      responses:
        "204": {description: User registered}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/auth/registrations/resend:
    post:
      tags: [authentication]
      summary: Resend registration OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationSessionId]
              properties:
                registrationSessionId: {type: string, format: uuid}
      responses:
        "200": {description: OTP was sent}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/login/code:
    post:
      tags: [authentication]
      summary: Request a login OTP
      description: Returns the same response whether the account exists or not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "202": {description: Request accepted}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/login/confirm:
    post:
      tags: [authentication]
      summary: Exchange login OTP for a token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: {type: string, format: email}
                code: {type: string, pattern: "^[0-9]{6}$"}
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/auth/tokens/refresh:
    post:
      tags: [tokens]
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefreshToken"}
      responses:
        "200":
          description: New token pair; the old refresh token is invalidated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/auth/logout:
    post:
      tags: [tokens]
      summary: Revoke one refresh session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefreshToken"}
      responses:
        "204": {description: Session revoked}
  /api/v1/auth/logout-all:
    post:
      tags: [tokens]
      security: [{bearerAuth: []}]
      summary: Revoke all refresh sessions
      responses:
        "204": {description: Sessions revoked}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/auth/me:
    get:
      tags: [users]
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Access token claims}
        "401": {$ref: "#/components/responses/Unauthorized"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistrationRequest:
      type: object
      required: [firstName, lastName, nickname, email, acceptedPrivacyPolicy]
      properties:
        firstName: {type: string}
        lastName: {type: string}
        nickname: {type: string, pattern: "^[a-zA-Z0-9_]{3,32}$"}
        email: {type: string, format: email}
        acceptedPrivacyPolicy: {type: boolean}
    RegistrationSession:
      type: object
      properties:
        registrationSessionId: {type: string, format: uuid}
        codeExpires: {type: integer, format: int64}
    ConfirmRegistration:
      type: object
      required: [registrationSessionId, code]
      properties:
        registrationSessionId: {type: string, format: uuid}
        code: {type: string, pattern: "^[0-9]{6}$"}
    RefreshToken:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string}
    TokenPair:
      type: object
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
    Error:
      type: object
      properties:
        error: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ValidationError:
      description: Field validation failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Retry after the cooldown
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
