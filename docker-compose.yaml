services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    ports:
      - "5555:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@postgres:5432/auth?sslmode=disable", "up"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "8025:8025"

  authnode:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      APP_ENV: development
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: auth
      PGSSLMODE: disable
      JWT_SECRET: development-jwt-secret-change-me-000000000000
      OTP_PEPPER: development-otp-pepper-change-me-0000000000
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 168h
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      HTTP_SERVER_ADDRESS: 0.0.0.0:8000
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres-data:
